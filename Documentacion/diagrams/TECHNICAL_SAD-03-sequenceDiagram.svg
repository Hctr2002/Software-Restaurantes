  <text x="240.5965" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Next.js API</text>
</g>
<g class="actor" data-id="DB" data-label="Supabase DB" data-type="participant">
  <rect x="329.06399999999996" y="30" width="114.719" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="386.4235" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Supabase DB</text>
</g>
<g class="actor" data-id="RT" data-label="Realtime Hub" data-type="participant">
  <rect x="483.783" y="30" width="108.79099999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="538.1785" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Realtime Hub</text>
</g>
<g class="actor" data-id="KDS" data-label="Kitchen KDS" data-type="participant">
  <rect x="632.574" y="30" width="107.30899999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="686.2284999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Kitchen KDS</text>
</g>
