</g>
<g class="message" data-from="KDS" data-to="KDS" data-label="Actualizar lista de tickets" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="686.2284999999999,250 716.2284999999999,250 716.2284999999999,270 686.2284999999999,270" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="724.2284999999999" y="260" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Actualizar lista de tickets</text>
</g>
<g class="message" data-from="KDS" data-to="DB" data-label="PUT orders/{id} (status: PREPARING)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="686.2284999999999" y1="320" x2="386.4235" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="536.326" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PUT orders/{id} (status: PREPARING)</text>
</g>
<g class="message" data-from="DB" data-to="RT" data-label="Evento UPDATE en orders" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="386.4235" y1="360" x2="538.1785" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="462.301" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Evento UPDATE en orders</text>
</g>
<g class="message" data-from="RT" data-to="C" data-label="Notificar cambio de estado" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="538.1785" y1="400" x2="91.06450000000001" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
