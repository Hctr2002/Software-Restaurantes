  <rect x="196.57499999999996" y="30" width="138.43099999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="265.79049999999995" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Admin Dashboard</text>
</g>
<g class="actor" data-id="DB" data-label="Supabase" data-type="participant">
  <rect x="375.006" y="30" width="94.71199999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="422.36199999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Supabase</text>
</g>
</svg>