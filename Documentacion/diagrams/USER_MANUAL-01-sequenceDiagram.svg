<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499.71799999999996 440" width="499.71799999999996" height="440" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="SA" x1="93.2875" y1="70" x2="93.2875" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="AD" x1="265.79049999999995" y1="70" x2="265.79049999999995" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="422.36199999999997" y1="70" x2="422.36199999999997" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="SA" data-to="AD" data-label="Crear restaurante (nombre, slug, plan)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="93.2875" y1="90" x2="265.79049999999995" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="179.539" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Crear restaurante (nombre, slug, plan)</text>
</g>
<g class="message" data-from="AD" data-to="DB" data-label="INSERT en restaurants" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="265.79049999999995" y1="130" x2="422.36199999999997" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="344.07624999999996" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">INSERT en restaurants</text>
</g>
<g class="message" data-from="DB" data-to="AD" data-label="Restaurante creado con ID" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="422.36199999999997" y1="170" x2="265.79049999999995" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="344.07624999999996" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Restaurante creado con ID</text>
</g>
<g class="message" data-from="SA" data-to="AD" data-label="Crear usuario ADMIN (email, password)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="93.2875" y1="210" x2="265.79049999999995" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="179.539" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Crear usuario ADMIN (email, password)</text>
</g>
<g class="message" data-from="AD" data-to="DB" data-label="Crear en auth.users + INSERT en users" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="265.79049999999995" y1="250" x2="422.36199999999997" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="344.07624999999996" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Crear en auth.users + INSERT en users</text>
</g>
<g class="message" data-from="SA" data-to="AD" data-label="Vincular usuario al restaurante" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="93.2875" y1="290" x2="265.79049999999995" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="179.539" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Vincular usuario al restaurante</text>
</g>
<g class="message" data-from="AD" data-to="DB" data-label="UPDATE users SET restaurant_id, role=ADMIN" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="265.79049999999995" y1="330" x2="422.36199999999997" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="344.07624999999996" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">UPDATE users SET restaurant_id, role=ADMIN</text>
</g>
<g class="message" data-from="DB" data-to="SA" data-label="Local listo para operar" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="422.36199999999997" y1="370" x2="93.2875" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="257.82475" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Local listo para operar</text>
</g>
<g class="actor" data-id="SA" data-label="SUPER_ADMIN" data-type="participant">
  <rect x="30.000000000000007" y="30" width="126.57499999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="93.2875" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">SUPER_ADMIN</text>
</g>
