<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626.279 390" width="626.279" height="390" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="U" x1="70.687" y1="70" x2="70.687" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="MW" x1="223.92400000000004" y1="70" x2="223.92400000000004" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="AUTH" x1="398.27950000000004" y1="70" x2="398.27950000000004" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="APP" x1="548.182" y1="70" x2="548.182" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="U" data-to="MW" data-label="GET /pizzeria-napoli/dashboard" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70.687" y1="90" x2="223.92400000000004" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="147.30550000000002" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GET /pizzeria-napoli/dashboard</text>
</g>
<g class="message" data-from="MW" data-to="AUTH" data-label="Verificar cookie de sesion" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="223.92400000000004" y1="130" x2="398.27950000000004" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="311.10175000000004" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Verificar cookie de sesion</text>
</g>
<g class="message" data-from="AUTH" data-to="MW" data-label="JWT con role=ADMIN, restaurant_id=uuid" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="398.27950000000004" y1="170" x2="223.92400000000004" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="311.10175000000004" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">JWT con role=ADMIN, restaurant_id=uuid</text>
</g>
<g class="message" data-from="MW" data-to="MW" data-label="Validar rol tiene acceso a /dashboard" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="223.92400000000004,210 253.92400000000004,210 253.92400000000004,230 223.92400000000004,230" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="261.92400000000004" y="220" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Validar rol tiene acceso a /dashboard</text>
</g>
<g class="message" data-from="MW" data-to="APP" data-label="Solicitud autorizada + contexto de tenant" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="223.92400000000004" y1="280" x2="548.182" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="386.053" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Solicitud autorizada + contexto de tenant</text>
</g>
<g class="message" data-from="APP" data-to="U" data-label="Renderizar dashboard del restaurante" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="548.182" y1="320" x2="70.687" y2="320" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="309.4345" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Renderizar dashboard del restaurante</text>
</g>
<g class="actor" data-id="U" data-label="Usuario" data-type="participant">
  <rect x="30" y="30" width="81.374" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70.687" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Usuario</text>
</g>
<g class="actor" data-id="MW" data-label="Middleware Next.js" data-type="participant">
  <rect x="151.37400000000002" y="30" width="145.10000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="223.92400000000004" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Middleware Next.js</text>
</g>
<g class="actor" data-id="AUTH" data-label="Supabase Auth" data-type="participant">
  <rect x="336.47400000000005" y="30" width="123.61099999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="398.27950000000004" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Supabase Auth</text>
</g>
<g class="actor" data-id="APP" data-label="Aplicacion" data-type="participant">
  <rect x="500.08500000000004" y="30" width="96.194" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="548.182" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Aplicacion</text>
</g>
</svg>